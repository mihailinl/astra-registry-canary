#
# The canary's own rules, held to fixtures and to this repository's files
# (tests/lib.test.mjs): the callers and their tag globs, the version rewrite,
# the binding line's grammar and its absence from main, the prune rule and the
# JWT lint; and (tests/staging.test.mjs) the staging listing's caller, which the
# weekly job reads and never tags.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A file list, not the directory: Node 22 reads `tests/` as a module path
      # and fails with MODULE_NOT_FOUND (the first run here, 35850911600).
      - run: node --test tests/*.test.mjs
