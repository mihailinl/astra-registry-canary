#
# The canary's own rules, held to fixtures and to this repository's files
# (tests/lib.test.mjs): the callers and their tag globs, the version rewrite,
# the binding line's grammar and its absence from main, the prune rule and the
# JWT lint.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/
